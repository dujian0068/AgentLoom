<text x="74" y="587" font-size="24" fill="#876321" font-weight="650">HookManager · 已实现的可信 Python 扩展</text>
<text x="74" y="620" font-size="19" fill="#4c6078" font-weight="400">挂点契约 / 注册与绑定 / 有序执行 / 超时与恢复 · 模型、工具、上下文、任务；Embedding 使用独立操作记录</text>
<text x="74" y="655" font-size="21" fill="#876321" font-weight="400">保存有效输入 → 实际调用 → 保存真实结果 → 后置 Hook → 保存有效输出</text>
<text x="74" y="681" font-size="18" fill="#4c6078" font-weight="400">无 Hook 也保留调用阶段；代码与契约版本进入检查点；上传隔离 Worker 待实现</text>
<text x="56" y="733" font-size="19" fill="#5d63ac" font-weight="400">可替换：模型网关 / 上下文 / 压缩 / 完成检查 / 执行策略 / Hooks；工具细节留在执行层。</text>
<path d="M718 764 L718 788" stroke="#6c809a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="36" y="797" width="1368" height="106" rx="12" fill="#eef7fb" stroke="#2f718e" stroke-width="1.5"/>
<text x="56" y="832" font-size="25" fill="#2f718e" font-weight="650">进程内 EventBus → ToolRuntime</text>
<text x="56" y="862" font-size="18" fill="#4c6078" font-weight="400">单处理器执行请求；关联结果返回 Loop；通知支持多个 Observer。当前不是跨机器消息队列。</text>
<text x="56" y="890" font-size="20" fill="#2f718e" font-weight="400">ToolDefinition / Registry → Hook → 权限、参数与策略校验 → Handler → 真实结果与有效观察</text>
<path d="M718 910 L718 933" stroke="#6c809a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
